# DEV 서버 배포: dev 브랜치에 머지(push)되면 백엔드를 DEV 컨테이너(gyeonjwo-api-dev)에 올린다.
# Actions 탭에서 수동 실행(Run workflow)도 된다. PRD 배포(deploy-server.yml, dev → main 머지 시)는 그대로다.
#
# - AWS 인증: GitHub OIDC → IAM 역할(환경 development의 변수 AWS_DEPLOY_ROLE_ARN)
#   IAM 역할 신뢰 정책에 repo:costflow-food/gyeonjwo_backend:environment:development 를,
#   권한 정책에 gyeonjwo-api-dev 컨테이너 서비스를 허용해야 한다.
# - 켜기: 저장소 변수 DEV_SERVER_DEPLOY=1 (Settings → Secrets and variables → Actions → Variables)
# - 환경변수는 DEV 컨테이너에 지금 실행 중인 값을 그대로 이어 쓴다(바꾸려면 Lightsail 콘솔).
#   DEV는 DEV_NO_AUTH_USER_ID(로그인 생략)·APP_ENVIRONMENT=development·DEV Supabase 값을 쓴다.
name: Deploy server (DEV)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-server-development
  # 배포 도중 끊기면 롤백도 못 하므로 앞 배포가 끝날 때까지 기다린다
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 저장소 변수 DEV_SERVER_DEPLOY=1 일 때만 (IAM·DEV 환경 준비 전에는 건너뜀)
    if: vars.DEV_SERVER_DEPLOY == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      SERVICE: gyeonjwo-api-dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # README의 로컬 회귀 점검. 외부 서비스(Supabase·Gmail·LLM) 실호출 없음
      - name: Regression checks
        run: python -m unittest scripts.check_graph_hold scripts.check_workflow_logs scripts.check_review_queue scripts.check_env_names

      - id: rev
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_REVISION=${{ steps.rev.outputs.sha }}
          tags: gyeonjwo-api:${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Deploy to Lightsail
        run: bash .github/scripts/deploy_lightsail.sh "gyeonjwo-api:${{ steps.rev.outputs.sha }}" "${{ steps.rev.outputs.sha }}"
