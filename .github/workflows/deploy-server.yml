# dev → main PR이 머지됐을 때만 백엔드를 AWS Lightsail 컨테이너 서비스(gyeonjwo-api, 서울)에 배포한다.
#
# - AWS 인증: GitHub OIDC → IAM 역할(환경 production의 변수 AWS_DEPLOY_ROLE_ARN). 장기 키 없음
# - 서버 비밀값(.env)은 Lightsail 서비스에만 있다. 배포 때마다 실행 중인 값을 그대로 이어 쓴다.
#   비밀값을 바꾸려면 Lightsail 콘솔에서 수정하거나 ENV_FILE로 .github/scripts/deploy_lightsail.sh를 실행한다.
name: Deploy server

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy-server-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 머지된 PR + 출발 브랜치가 이 저장소의 dev 일 때만
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      SERVICE: gyeonjwo-api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # README의 로컬 회귀 점검. 외부 서비스(Supabase·Gmail·LLM) 실호출 없음
      - name: Regression checks
        run: python -m unittest scripts.check_graph_hold scripts.check_workflow_logs scripts.check_review_queue

      - id: rev
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: BUILD_REVISION=${{ steps.rev.outputs.sha }}
          tags: gyeonjwo-api:${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Deploy to Lightsail
        run: bash .github/scripts/deploy_lightsail.sh "gyeonjwo-api:${{ steps.rev.outputs.sha }}" "${{ steps.rev.outputs.sha }}"
