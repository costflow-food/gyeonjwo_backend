# dev → main PR이 머지됐을 때만 백엔드 이미지를 검증·빌드해 GHCR에 올린다.
#   ghcr.io/<owner>/gyeonjwo_backend:main, :<커밋 SHA>
# 서버에 반영하는 단계(맨 아래 deploy job)는 배포 담당이 서버 방식에 맞춰 채운다.
name: Deploy server

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy-server-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # 머지된 PR + 출발 브랜치가 이 저장소의 dev 일 때만
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # README의 로컬 회귀 점검. 외부 서비스(Supabase·Gmail·LLM) 실호출 없음
      - name: Regression checks
        run: python -m unittest scripts.check_graph_hold scripts.check_workflow_logs scripts.check_review_queue

      - id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_REVISION=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # TODO(배포 담당): 서버 방식에 맞춰 교체한다.
      # 예) Docker VM이면 SSH로 접속해
      #     docker compose pull && docker compose up -d
      #     curl -fsS http://127.0.0.1:8000/health
      - run: echo "이미지 ${{ needs.build.outputs.image }}:main 준비 완료. 서버 반영 단계는 아직 없음"
